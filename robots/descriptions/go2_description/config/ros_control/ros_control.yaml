controller_manager:
  ros__parameters:
    use_sim_time: True
    update_rate: 1000  # Hz - must match simulation update rate

    joint_states_controller:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_group_effort_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Used only with controller:=model. The RL policy does its own PD (with the
    # stiffness/damping it was trained against) and sends raw efforts, so it needs a
    # plain group-effort controller rather than the trajectory controller's PID.
    # Only one of these two may be active at a time -- they claim the same command
    # interfaces -- which is what makes the controller:= switch exclusive.
    rl_joint_effort_controller:
      type: effort_controllers/JointGroupEffortController

# The broadcaster otherwise publishes on every controller_manager update, i.e. ~1 kHz.
# robot_state_publisher republishes TF on every one of those, which flooded the graph
# with ~650 TF messages/s and starved the EKF badly enough to stall SLAM. 200 Hz is
# still at or above every consumer's own loop rate.
joint_states_controller:
  ros__parameters:
    use_sim_time: True
    update_rate: 200

joint_group_effort_controller:
  ros__parameters:
    use_sim_time: True
    joints:
        - lf_hip_joint
        - lf_upper_leg_joint
        - lf_lower_leg_joint
        - rf_hip_joint
        - rf_upper_leg_joint
        - rf_lower_leg_joint
        - lh_hip_joint
        - lh_upper_leg_joint
        - lh_lower_leg_joint
        - rh_hip_joint
        - rh_upper_leg_joint
        - rh_lower_leg_joint
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    
    gains:
      lf_hip_joint        : {p: 100.0, i: 0.2, d: 1.0, i_clamp: 2.5, ff_velocity_scale: 1.0}
      lf_upper_leg_joint  : {p: 100.0, i: 0.2, d: 1.0, i_clamp: 2.5, ff_velocity_scale: 1.0}
      lf_lower_leg_joint  : {p: 100.0, i: 0.2, d: 1.0, i_clamp: 2.5, ff_velocity_scale: 1.0}
      rf_hip_joint        : {p: 100.0, i: 0.2, d: 1.0, i_clamp: 2.5, ff_velocity_scale: 1.0}
      rf_upper_leg_joint  : {p: 100.0, i: 0.2, d: 1.0, i_clamp: 2.5, ff_velocity_scale: 1.0}
      rf_lower_leg_joint  : {p: 100.0, i: 0.2, d: 1.0, i_clamp: 2.5, ff_velocity_scale: 1.0}
      lh_hip_joint        : {p: 100.0, i: 0.2, d: 1.0, i_clamp: 2.5, ff_velocity_scale: 1.0}
      lh_upper_leg_joint  : {p: 100.0, i: 0.2, d: 1.0, i_clamp: 2.5, ff_velocity_scale: 1.0}
      lh_lower_leg_joint  : {p: 100.0, i: 0.2, d: 1.0, i_clamp: 2.5, ff_velocity_scale: 1.0}
      rh_hip_joint        : {p: 100.0, i: 0.2, d: 1.0, i_clamp: 2.5, ff_velocity_scale: 1.0}
      rh_upper_leg_joint  : {p: 100.0, i: 0.2, d: 1.0, i_clamp: 2.5, ff_velocity_scale: 1.0}
      rh_lower_leg_joint  : {p: 100.0, i: 0.2, d: 1.0, i_clamp: 2.5, ff_velocity_scale: 1.0}
      
      # {p: 67.5, d: 0.3, i: 0.1, i_clamp: 1.5}
    # action_monitor_rate: 10.0 # Defaults to 20
    # state_publish_rate: 10.0 # Defaults to 50
    # open_loop_control: true
    # allow_integration_in_goal_trajectories: true
    # constraints:
    #   stopped_velocity_tolerance: 0.01 # Defaults to 0.01
    #   goal_time: 0.0 # Defaults to 0.0 (start immediately)

rl_joint_effort_controller:
  ros__parameters:
    use_sim_time: True
    # ORDER MATTERS: the policy publishes one Float64MultiArray whose i-th element is
    # the effort for the i-th joint listed here. This must stay identical to
    # ros_joint_names in go2_config/config/rl/policy.yaml -- IsaacLab's articulation
    # order, i.e. all four hips, then all four thighs, then all four calves.
    joints:
      - lf_hip_joint
      - rf_hip_joint
      - lh_hip_joint
      - rh_hip_joint
      - lf_upper_leg_joint
      - rf_upper_leg_joint
      - lh_upper_leg_joint
      - rh_upper_leg_joint
      - lf_lower_leg_joint
      - rf_lower_leg_joint
      - lh_lower_leg_joint
      - rh_lower_leg_joint

